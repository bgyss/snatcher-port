name: release
# Push a tag like v0.2.0 (tools/release.sh does this) to build macOS, Windows and Linux packages and publish them as a
# GitHub Release. A tag with a suffix (v0.2.0-rc1) becomes a pre-release. "Run workflow" on a branch builds everything
# but publishes nothing (a dry run).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Name the files after the tag and checksum them
        run: |
          mkdir release
          for f in artifacts/Snatcher-*; do
            base=$(basename "$f")
            cp "$f" "release/Snatcher-${GITHUB_REF_NAME}-${base#Snatcher-}"
          done
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "Snatcher port ${GITHUB_REF_NAME}" --generate-notes --verify-tag)
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          notes=$'No game data is included: you need your own US Sega CD disc image (.cue + .bin).\nSee the README inside each package. The macOS and Windows builds are unsigned, so the OS will warn on first launch.'
          gh release create "$GITHUB_REF_NAME" release/* "${flags[@]}" --notes "$notes"
