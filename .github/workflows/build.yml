name: build
# Interpreter-only player packages for macOS, Windows and Linux. No disc or extracted game code is available in CI,
# so nothing built here contains translated (disc-derived) code; tools/package/ci_package.sh also refuses if it does.
# release.yml reuses this workflow for tagged releases.
on:
  push:
    branches: ['**']   # tag pushes are handled by release.yml
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos,   os: macos-latest }
          - { name: windows, os: windows-latest }
          - { name: linux,   os: ubuntu-22.04 }   # oldest LTS runner: the binary needs glibc 2.35+
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config python3 \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxfixes-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libegl1-mesa-dev libudev-dev libdbus-1-dev

      - name: Set up MSYS2 MinGW-w64 (Windows)
        if: matrix.name == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python

      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: tools/package/ci_package.sh mac

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: tools/package/ci_package.sh linux

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        env:
          PYTHON: python
        run: tools/package/ci_package.sh windows

      - name: Zip (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ci/Snatcher-windows-x64 -DestinationPath dist/ci/Snatcher-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: snatcher-${{ matrix.name }}
          path: |
            dist/ci/Snatcher-mac.zip
            dist/ci/Snatcher-windows-x64.zip
            dist/ci/Snatcher-linux-x86_64.tar.gz
          if-no-files-found: error
