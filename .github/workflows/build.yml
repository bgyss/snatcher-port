name: build
on:
  push:
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL3 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl3
      - name: Fetch SDL3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "3.2.16"
          Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-$v/SDL3-devel-$v-VC.zip" -OutFile sdl.zip
          Expand-Archive sdl.zip -DestinationPath sdl
          echo "SDL3_DIR=$PWD/sdl/SDL3-$v/cmake" >> $env:GITHUB_ENV
          echo "SDL3_BIN=$PWD/sdl/SDL3-$v/lib/x64" >> $env:GITHUB_ENV
      - name: Configure
        run: cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist && cp build/snatcher dist/ && cp build/scd_headless dist/
          tar -czf snatcher-${{ matrix.name }}.tar.gz -C dist .
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item build/Release/snatcher.exe dist/
          Copy-Item build/Release/scd_headless.exe dist/
          Copy-Item "$env:SDL3_BIN/SDL3.dll" dist/
          Compress-Archive dist/* snatcher-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: snatcher-${{ matrix.name }}
          path: snatcher-${{ matrix.name }}.*
